<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490" width="520" height="490" role="img" aria-labelledby="title desc">
<title id="title">Refresh or log in again</title><desc id="desc">An expired access token is rejected. A valid active refresh session can rotate its refresh token and issue a new access token. Otherwise login is required.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#ffb347"/></marker></defs>
<rect width="520" height="490" rx="16" fill="#17181c"/>
<g font-family="Arial, sans-serif"><rect x="28" y="24" width="464" height="74" rx="12" fill="#24272f" stroke="#687080"/><text x="260.0" y="53" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Access token has expired</text><text x="260.0" y="78" text-anchor="middle" fill="#e1e4eb" font-size="17">API rejects the protected request</text><path d="M260 98 V126" stroke="#ffb347" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="28" y="136" width="464" height="74" rx="12" fill="#392811" stroke="#ffb347"/><text x="260.0" y="165" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Check the refresh credential</text><text x="260.0" y="190" text-anchor="middle" fill="#e1e4eb" font-size="17">Valid, unexpired, and session active?</text><path d="M260 210 V234 H138 V260" stroke="#ffb347" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M260 234 H382 V260" stroke="#ffb347" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="28" y="270" width="220" height="74" rx="12" fill="#17332e" stroke="#7ddcc3"/><text x="138.0" y="299" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">YES</text><text x="138.0" y="324" text-anchor="middle" fill="#e1e4eb" font-size="17">Rotate R1 to R2</text><rect x="272" y="270" width="220" height="74" rx="12" fill="#3a2027" stroke="#f79aab"/><text x="382.0" y="299" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">NO</text><text x="382.0" y="324" text-anchor="middle" fill="#e1e4eb" font-size="17">Require login</text><path d="M138 344 V370" stroke="#ffb347" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M382 344 V370" stroke="#ffb347" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="28" y="380" width="220" height="74" rx="12" fill="#17332e" stroke="#7ddcc3"/><text x="138.0" y="409" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">New access token</text><text x="138.0" y="434" text-anchor="middle" fill="#e1e4eb" font-size="17">Retry the request once</text><rect x="272" y="380" width="220" height="74" rx="12" fill="#3a2027" stroke="#f79aab"/><text x="382.0" y="409" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Keep form contents</text><text x="382.0" y="434" text-anchor="middle" fill="#e1e4eb" font-size="17">Ask user to sign in</text></g></svg>

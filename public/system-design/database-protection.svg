<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 466" width="520" height="466" role="img" aria-labelledby="title desc">
<title id="title">Hash or encrypt?</title><desc id="desc">Passwords are hashed and verified, never decrypted. Recoverable private fields are encrypted with keys protected separately from the database.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#ffb347"/></marker></defs>
<rect width="520" height="466" rx="16" fill="#17181c"/>
<g font-family="Arial, sans-serif"><rect x="28" y="24" width="464" height="74" rx="12" fill="#392811" stroke="#ffb347"/><text x="260.0" y="53" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Passwords</text><text x="260.0" y="78" text-anchor="middle" fill="#e1e4eb" font-size="17">Need to check a login, not read the password</text><path d="M260 98 V122" stroke="#ffb347" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="28" y="132" width="464" height="74" rx="12" fill="#24272f" stroke="#687080"/><text x="260.0" y="161" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Slow password hash</text><text x="260.0" y="186" text-anchor="middle" fill="#e1e4eb" font-size="17">Argon2id or bcrypt; use library verification</text><rect x="28" y="254" width="464" height="74" rx="12" fill="#392811" stroke="#ffb347"/><text x="260.0" y="283" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Recoverable private data</text><text x="260.0" y="308" text-anchor="middle" fill="#e1e4eb" font-size="17">Example: a delivery address</text><path d="M260 328 V352" stroke="#ffb347" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="28" y="362" width="464" height="74" rx="12" fill="#24272f" stroke="#687080"/><text x="260.0" y="391" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Authenticated encryption</text><text x="260.0" y="416" text-anchor="middle" fill="#e1e4eb" font-size="17">Read with a separately protected key</text><text x="260" y="450" text-anchor="middle" fill="#ffb347" font-size="17">Both also need database access controls.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 444" width="520" height="444" role="img" aria-labelledby="title desc">
<title id="title">Stop a stolen access token</title><desc id="desc">After verifying the JWT, the API checks a shared blocklist. A blocked token ID is rejected even before token expiry.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#ffb347"/></marker></defs>
<rect width="520" height="444" rx="16" fill="#17181c"/>
<g font-family="Arial, sans-serif"><rect x="28" y="24" width="464" height="74" rx="12" fill="#24272f" stroke="#687080"/><text x="260.0" y="53" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Request with a copied JWT</text><text x="260.0" y="78" text-anchor="middle" fill="#e1e4eb" font-size="17">The attacker holds a valid token</text><path d="M260 98 V126" stroke="#ffb347" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="28" y="136" width="464" height="74" rx="12" fill="#24272f" stroke="#687080"/><text x="260.0" y="165" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">API verifies the JWT</text><text x="260.0" y="190" text-anchor="middle" fill="#e1e4eb" font-size="17">Signature, expiry, issuer, audience</text><path d="M260 210 V238" stroke="#ffb347" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="28" y="248" width="464" height="74" rx="12" fill="#392811" stroke="#ffb347"/><text x="260.0" y="277" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Check the token ID (jti)</text><text x="260.0" y="302" text-anchor="middle" fill="#e1e4eb" font-size="17">Shared blocklist: token is blocked</text><path d="M260 322 V350" stroke="#ffb347" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="28" y="360" width="464" height="74" rx="12" fill="#3a2027" stroke="#f79aab"/><text x="260.0" y="389" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Reject this request</text><text x="260.0" y="414" text-anchor="middle" fill="#e1e4eb" font-size="17">Blocked tokens are rejected before expiry</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 466" width="520" height="466" role="img" aria-labelledby="title desc">
<title id="title">Revoke the right sessions</title><desc id="desc">Current-device logout revokes one session. All-device logout revokes every user session. Revoke refresh tokens as well; APIs check session status.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#ffb347"/></marker></defs>
<rect width="520" height="466" rx="16" fill="#17181c"/>
<g font-family="Arial, sans-serif"><rect x="28" y="24" width="464" height="74" rx="12" fill="#392811" stroke="#ffb347"/><text x="260.0" y="53" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Choose logout scope</text><text x="260.0" y="78" text-anchor="middle" fill="#e1e4eb" font-size="17">This device or every device?</text><path d="M260 98 V122 H138 V148" stroke="#ffb347" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><path d="M260 122 H382 V148" stroke="#ffb347" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="28" y="158" width="220" height="74" rx="12" fill="#24272f" stroke="#687080"/><text x="138.0" y="187" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">This device</text><text x="138.0" y="212" text-anchor="middle" fill="#e1e4eb" font-size="17">Revoke one session</text><rect x="272" y="158" width="220" height="74" rx="12" fill="#24272f" stroke="#687080"/><text x="382.0" y="187" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Every device</text><text x="382.0" y="212" text-anchor="middle" fill="#e1e4eb" font-size="17">Revoke all sessions</text><path d="M138 232 V254 H382 V232" stroke="#ffb347" stroke-width="2.5" fill="none"/><path d="M260 254 V278" stroke="#ffb347" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="28" y="288" width="464" height="74" rx="12" fill="#392811" stroke="#ffb347"/><text x="260.0" y="317" text-anchor="middle" fill="#fff" font-size="20" font-weight="700">Revoke refresh tokens too</text><text x="260.0" y="342" text-anchor="middle" fill="#e1e4eb" font-size="17">Clear credentials in the current browser</text><path d="M260 362 V386" stroke="#ffb347" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="260" y="422" text-anchor="middle" fill="#7ddcc3" font-size="20" font-weight="700">APIs reject revoked sessions</text><text x="260" y="447" text-anchor="middle" fill="#e1e4eb" font-size="17">Existing JWT copies are blocked by the check.</text></g></svg>
